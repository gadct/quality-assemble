# Publishes a release when a tag like v0.3.0 is pushed.
# Assets:
#   quality-assemble.zip          -> extension for Chromium browsers (Chrome, Edge, Opera, Opera GX, Brave, Vivaldi)
#   quality-assemble-firefox.zip  -> same code, manifest adapted for Firefox (sidebar, background scripts, gecko id)
#   instalar.ps1 / actualizar.ps1 -> installer and updater (downloaded by the one-line install command)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          V=$(jq -r .version extension/manifest.json)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "manifest.json says $V but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build Chromium zip
        run: (cd extension && zip -r ../quality-assemble.zip .)

      - name: Build Firefox zip
        run: |
          rm -rf build-ff && cp -r extension build-ff
          jq 'del(.key, .side_panel)
              | .permissions -= ["sidePanel"]
              | .background = { scripts: ["background.js"] }
              | .sidebar_action = { default_panel: "sidepanel.html", default_title: "Quality Assemble", open_at_install: false }
              | .browser_specific_settings = { gecko: { id: "quality-assemble@gadct", strict_min_version: "128.0" } }' \
              extension/manifest.json > build-ff/manifest.json
          (cd build-ff && zip -r ../quality-assemble-firefox.zip .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            quality-assemble.zip quality-assemble-firefox.zip \
            instalador/instalar.ps1 instalador/actualizar.ps1 \
            --title "$GITHUB_REF_NAME" --generate-notes
